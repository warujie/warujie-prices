# THROWAWAY: screenshots the test site's news page (?view=news) with its real data; delete this branch after.
name: Probe news page
on: { push: { branches: [probe-news-page] } }
permissions: { contents: write }
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          mkdir -p probe_out
          ( python3 probe_news.py ) > probe_out/log.txt 2>&1 || true
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe_out && git commit -qm "probe result [skip ci]" && git push
