# Daily price history for 悪知恵.
#
# This file belongs in a SEPARATE repository named  warujie-prices
# (not the site's repository), at:
#     .github/workflows/update-prices.yml
# next to build_prices.py in the top folder of that repository.
#
# Every day it reads today's prices from Scryfall (TCGplayer in dollars,
# Cardmarket in euros) and the day's prices at several shops from MTGJSON
# (TCGplayer, Card Kingdom, Cardsphere, Cardmarket), adds them to the history
# that is already published, and publishes the result to the private Cloudflare R2
# bucket warujie-price-data (which warujie.jp reads through its Worker at /data/) and
# with GitHub Pages at
#     https://<your-user-name>.github.io/warujie-prices/ Nothing is committed to the repository,
# so it never grows.
#
# While the history is shorter than 60 days (or has no euro prices yet), the
# run also fills in the last 90 days of US (TCGplayer) and European
# (Cardmarket) prices from MTGJSON's free archive - a one-off download of a
# few hundred MB that takes a few extra minutes - so price charts and price
# movers work from the first day.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

name: Update price history

on:
  schedule:
    - cron: "17 12 * * *"   # every day at 12:17 UTC (21:17 in Japan), after Scryfall's daily export
  workflow_dispatch:         # adds a "Run workflow" button
  push:                      # and runs when the builder or this file changes
    branches: [main]
    paths: [build_prices.py, shop_enndal.py, build_combos.py, build_tags.py, .github/workflows/update-prices.yml]

permissions:
  contents: read
  deployments: read          # to tell whether this is the very first run
  actions: read              # to fetch last night's ENNDAL GAMES data (enndal-nightly.yml)
  pages: write               # to publish the data
  id-token: write            # required by GitHub Pages publishing

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The site reads the prices from https://<your-user-name>.github.io/warujie-prices/,
      # so this only works in a repository with exactly that name.
      - name: Check this is the warujie-prices repository
        run: |
          if [ "${GITHUB_REPOSITORY#*/}" != "warujie-prices" ]; then
            echo "::error::This workflow is in ${GITHUB_REPOSITORY}, but it belongs in a separate repository named warujie-prices (the site reads the prices from https://${GITHUB_REPOSITORY_OWNER}.github.io/warujie-prices/). Create that repository, move build_prices.py and .github/workflows/update-prices.yml there, and delete both from ${GITHUB_REPOSITORY}."
            exit 1
          fi

      - uses: actions/checkout@v6

      # Where the data is published now (also works after adding a custom domain)
      - name: Find the published address
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url 2>/dev/null || true)
          if [ -z "$url" ]; then url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"; fi
          echo "Previous data: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # never published before -> this is the first run and a new history may be started
          n=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=1" --jq length 2>/dev/null || echo error)
          if [ "$n" = "0" ]; then echo "First run - starting a new history."; echo "fresh=--allow-fresh" >> "$GITHUB_OUTPUT"; fi

      # ENNDAL GAMES' stock, read at 2am Japan time by enndal-nightly.yml and
      # kept as that run's "enndal" artifact. Without it (no run yet, or it
      # failed) the published ENNDAL offers are kept for up to a week.
      - name: Fetch last night's ENNDAL GAMES data
        id: enndal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=enndal&per_page=1" --jq '.artifacts[] | select(.expired | not) | .id' 2>/dev/null || true)
          if [ -n "$id" ] && gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > enndal.zip && unzip -o -q enndal.zip -d enndal && [ -f enndal/enndal.json.gz ]; then
            echo "arg=--enndal enndal/enndal.json.gz" >> "$GITHUB_OUTPUT"
          else
            echo "No ENNDAL GAMES data from last night; the published ENNDAL offers are kept."
          fi

      # The same files also live in a private Cloudflare R2 bucket (warujie-price-data), which
      # warujie.jp reads through its Worker at /data/. CLOUDFLARE_R2_TOKEN is a Cloudflare API
      # token that may only edit R2 (Settings -> Secrets and variables -> Actions); R2's S3-style
      # key pair comes from it (key id = the token's id, secret = SHA-256 of the token). The
      # previous data is read from R2; while R2 is empty, or if reading it fails, it comes from
      # GitHub Pages instead. Without the secret R2 is skipped.
      - name: Read the published data from R2
        id: r2
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::warning::No CLOUDFLARE_R2_TOKEN secret: R2 is skipped."; exit 0; fi
          key=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.id // empty')
          acct=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')
          if [ -z "$key" ] || [ -z "$acct" ]; then echo "::error::The CLOUDFLARE_R2_TOKEN token is not accepted by Cloudflare."; exit 1; fi
          secret=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$secret"
          { echo "AWS_ACCESS_KEY_ID=$key"; echo "AWS_SECRET_ACCESS_KEY=$secret"; echo "AWS_DEFAULT_REGION=auto"; echo "AWS_REQUEST_CHECKSUM_CALCULATION=when_required"; echo "AWS_RESPONSE_CHECKSUM_VALIDATION=when_required"
            echo "R2_ENDPOINT=https://$acct.r2.cloudflarestorage.com"; echo "R2_BUCKET=s3://warujie-price-data"; } >> "$GITHUB_ENV"
          echo "ok=1" >> "$GITHUB_OUTPUT"
          if aws s3 sync "s3://warujie-price-data" prev --endpoint-url "https://$acct.r2.cloudflarestorage.com" --only-show-errors && [ -f prev/index.json ]; then
            echo "previous=prev" >> "$GITHUB_OUTPUT"
            echo "Previous data: R2 ($(find prev -type f | wc -l) files)"
          else
            echo "R2 has no complete copy yet: the previous data comes from GitHub Pages this time."
            rm -rf prev
          fi

      # Stops (without publishing) if the old history can't be read or
      # Scryfall's export looks incomplete, so the history is never lost.
      # (If MTGJSON can't be reached, the day's update still goes ahead.)
      # CardTrader's European sellers are read when the repository has a
      # CARDTRADER_TOKEN secret (a CardTrader account's API token; Settings ->
      # Secrets and variables -> Actions). Without it they are simply skipped.
      - name: Build the price history
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python3 build_prices.py --out site --previous "${{ steps.r2.outputs.previous || steps.pages.outputs.url }}" ${{ steps.pages.outputs.fresh }} ${{ steps.enndal.outputs.arg }}

      # Commander combos for the card pages, from Commander Spellbook's bulk
      # file: rebuilt once a week, copied over from the published data on
      # the other days. Never stops the price update.
      - name: Build the Commander combos
        run: python3 build_combos.py --out site/c --previous "${{ steps.r2.outputs.previous || steps.pages.outputs.url }}"

      # What each card does (removal, card draw, ramp...) for the site's role
      # search and similar cards, from Scryfall Tagger's oracle tags: rebuilt
      # once a week, copied over from the published data on the other days.
      # Never stops the price update.
      - name: Build the role tags
        run: python3 build_tags.py --out site/t --previous "${{ steps.r2.outputs.previous || steps.pages.outputs.url }}"

      # Published to R2 first: if that fails the run stops, so R2 and GitHub Pages never
      # disagree about which days the history has. Files are only added or replaced.
      - name: Publish to R2
        if: steps.r2.outputs.ok == '1'
        run: aws s3 sync site "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
