name: Probe deck builder screenshots
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/claude/project-thread-sylr69'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          mkdir -p probe_out
          ( pip install playwright==1.48.0 && python -m playwright install --with-deps chromium && python probe/shots.py ) > probe_out/run_log.txt 2>&1 || true
          tail -40 probe_out/run_log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
