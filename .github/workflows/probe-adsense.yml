name: probe adsense live
on: { push: { branches: [probe-adsense-live] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ( for u in https://warujie.jp/ads.txt https://www.warujie.jp/ads.txt http://warujie.jp/ads.txt https://warujie.warujie-mtg.workers.dev/ads.txt; do
              for ua in "Mozilla/5.0 (warujie.jp probe)" "Mediapartners-Google"; do
                echo "== $u [$ua]"; curl -sS -L -o body.txt -w "status %{http_code} %{content_type} final %{url_effective}\n" -A "$ua" "$u"; head -c 200 body.txt | tr -d '\r'; echo
              done
            done
            echo "== headers"; curl -sSI -A "Mediapartners-Google" https://warujie.jp/ads.txt ) > probe_out.txt 2>&1 || true
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out.txt; git commit -m "probe output"; git push
