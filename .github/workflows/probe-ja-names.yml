name: Probe Japanese names
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-ja-names'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          mkdir -p probe_out
          ( set -x; pip install pillow; if [ -f probe/step.sh ]; then bash probe/step.sh; fi ) > probe_out/log.txt 2>&1 || true
          tail -50 probe_out/log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git pull --rebase || true
          git add probe_out && git commit -m "probe result [skip ci]" && git push
