name: Probe live (one-off)
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/claude/project-thread-9uy020'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe_out
          ( curl -fsS --compressed -A "warujie.jp check" https://warujie.warujie-mtg.workers.dev/ -o live.html
            echo "bytes: $(wc -c < live.html)"
            for w in nukeninmtg.com todo.ocnk.net dorasuta.jp shop.arcana-tcg.com f-conclave.net johnnymagic.jp playfirstgames.jp square-3rd.jp hasuya.jp c-labo-online.jp suruga-ya.jp; do echo "$w: $(grep -c "$w" live.html)"; done ) > probe_out/live.txt 2>&1 || true
          cat probe_out/live.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
