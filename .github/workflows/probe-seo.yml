name: Probe staging SEO
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-seo-check'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          mkdir -p probe_out
          ( python3 probe_seo.py ) > probe_out/live_log.txt 2>&1 || true
          cat probe_out/live_log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
