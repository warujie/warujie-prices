name: Probe live page (OFUSE button)
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-live-ofuse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe_out
          ( curl -s --compressed -A "warujie.jp probe" https://warujie.warujie-mtg.workers.dev/ -o page.html -w "status %{http_code}\n"
            sha256sum page.html
            echo "ofuse: $(grep -c "const SUPPORT_URL = 'https://ofuse.me/warujie';" page.html)"
            echo "curSym: $(grep -c 'id="curSym"' page.html)" ) > probe_out/live.txt 2>&1 || true
          cat probe_out/live.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
