name: Probe sets data
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-sets-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          UA="warujie.jp-dev-probe/1.0"
          (
          curl -sS -A "$UA" -H 'Accept: application/json' https://api.scryfall.com/sets -o out/sets.json; sleep 0.3
          for s in dsk mh3 fdn; do
            curl -sS -A "$UA" -H 'Accept: application/json' -G https://api.scryfall.com/cards/search --data-urlencode "q=e:$s lang:ja (game:paper)" --data-urlencode unique=prints --data-urlencode order=set --data-urlencode dir=asc -o out/search_$s.json; sleep 0.3
          done
          ls -la out
          ) > out/log.txt 2>&1 || true
          cat out/log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out && git commit -m "probe result [skip ci]" && git push
