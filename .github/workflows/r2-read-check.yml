# One-off: checks the R2 read step alone. Removed afterwards.
name: R2 read check (one-off)
'on':
  push:
    branches:
    - claude/project-thread-2174h4
    paths:
    - .github/workflows/r2-read-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Read the published data from R2
      id: r2
      env:
        CF_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
      run: "if [ -z \"$CF_TOKEN\" ]; then echo \"::error::No CLOUDFLARE_R2_TOKEN secret: the data can't be read or published.\"; exit 1; fi\nkey=$(curl -fsS -H \"Authorization: Bearer $CF_TOKEN\" https://api.cloudflare.com/client/v4/user/tokens/verify\
        \ | jq -r '.result.id // empty')\nacct=$(curl -fsS -H \"Authorization: Bearer $CF_TOKEN\" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')\nif [ -z \"$key\" ] || [\
        \ -z \"$acct\" ]; then echo \"::error::The CLOUDFLARE_R2_TOKEN token is not accepted by Cloudflare.\"; exit 1; fi\nsecret=$(printf %s \"$CF_TOKEN\" | sha256sum | cut -d' ' -f1)\necho \"::add-mask::$secret\"\
        \n{ echo \"AWS_ACCESS_KEY_ID=$key\"; echo \"AWS_SECRET_ACCESS_KEY=$secret\"; echo \"AWS_DEFAULT_REGION=auto\"; echo \"AWS_REQUEST_CHECKSUM_CALCULATION=when_required\"; echo \"AWS_RESPONSE_CHECKSUM_VALIDATION=when_required\"\
        \n  echo \"R2_ENDPOINT=https://$acct.r2.cloudflarestorage.com\"; echo \"R2_BUCKET=s3://warujie-price-data\"; } >> \"$GITHUB_ENV\"\n# GITHUB_ENV only reaches the later steps, so this step needs the\
        \ keys too\nexport AWS_ACCESS_KEY_ID=\"$key\" AWS_SECRET_ACCESS_KEY=\"$secret\" AWS_DEFAULT_REGION=auto AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required\n\
        if aws s3 sync \"s3://warujie-price-data\" prev --endpoint-url \"https://$acct.r2.cloudflarestorage.com\" --only-show-errors && [ -f prev/index.json ]; then\n  echo \"Previous data: R2 ($(find prev\
        \ -type f | wc -l) files)\"\nelse\n  echo \"::error::R2 could not be read (or has no index.json): stopping so the history is kept.\"; exit 1\nfi\n"
    - run: ls prev | head; du -sh prev; jq -r .today prev/index.json
