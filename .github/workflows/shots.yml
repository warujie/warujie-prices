name: Combo screenshots (one-off)
on: push
permissions: { contents: write }
jobs:
  shots:
    if: github.ref == 'refs/heads/probe-combo-shots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          mkdir -p out
          ( pip install -q playwright && python -m playwright install --with-deps chromium && python shots.py ) > out/log.txt 2>&1 || true
          cat out/log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out && git commit -m "probe result [skip ci]" && git push
