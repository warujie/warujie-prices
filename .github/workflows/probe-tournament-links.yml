name: Probe tournament links
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-tournament-links'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          ( pip install playwright==1.56.0 && python3 -m playwright install --with-deps chromium && python3 probe/shot_events.py ) > probe/log.txt 2>&1 || true
          tail -80 probe/log.txt
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe/log.txt probe/events-*.png probe/events-site.json 2>/dev/null; git commit -m "probe result [skip ci]" && git push
