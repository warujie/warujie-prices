name: Probe tournament links
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-tournament-links'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          ( python3 probe/links_probe2.py ) > probe/log.txt 2>&1 || true
          cat probe/log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe && git commit -m "probe result [skip ci]" && git push
