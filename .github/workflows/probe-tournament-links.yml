name: Probe tournament links
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-tournament-links'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install cryptography
      - run: |
          ( python3 probe/build_events.py --out out/events.json && python3 -c "
          import json, collections; d = json.load(open('out/events.json')); ev = d['events']
          print(d['sources']); print(collections.Counter(e['p'] for e in ev).most_common(20))
          print(collections.Counter((e['shop'], e['store'], e['c']) for e in ev).most_common(80))
          print(collections.Counter(tuple(e.get('f', [])) for e in ev).most_common(15))
          for e in ev[:5] + ev[-3:]: print(e)
          " ) > probe/log.txt 2>&1 || true
          cat probe/log.txt
      - uses: actions/upload-artifact@v4
        with: { name: events, path: out/events.json, retention-days: 1, if-no-files-found: ignore }
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe/log.txt && git commit -m "probe result [skip ci]" && git push
