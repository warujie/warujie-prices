name: seo probe
on: { push: { branches: [claude/project-thread-fte5ae] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: (bash seo_probe/probe.sh) > seo_probe/log.txt 2>&1 || true
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add seo_probe/log.txt; git commit -m "probe log"; git push
