name: SEO probe (throwaway)
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/claude/project-thread-fte5ae'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          (bash seo_probe/probe.sh) > seo_probe/log.txt 2>&1 || true
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add seo_probe/log.txt && git commit -m "probe result [skip ci]" && git push
