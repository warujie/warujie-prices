# TEMPORARY test of build_precons.py on GitHub's runners (the sandbox can't reach MTGJSON).
# Remove before merging this branch.
name: Probe precons
on:
  push:
    branches: [claude/project-thread-r57944]
    paths: [build_precons.py, .github/workflows/probe-precons.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Build
        run: |
          mkdir -p probe_out
          ( python3 build_precons.py --out probe_out --force ) > probe_out/log.txt 2>&1 || true
          ( curl -sS -A "WarujiePreconBuilder/1.0 (+https://github.com/warujie/warujie-prices)" https://mtgjson.com/api/v5/decks/AnimatedArmy_BLC.json | python3 -c "
          import json,sys; d=json.load(sys.stdin)['data']
          print({k:(len(v) if isinstance(v,list) else v) for k,v in d.items()})
          for part in ('commander','displayCommander','mainBoard','sideBoard'):
              for c in (d.get(part) or [])[:3]: print(part, c.get('count'), c.get('name'), c.get('faceName'), c.get('setCode'), c.get('number'))
          " ) > probe_out/sample.txt 2>&1 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_out
          git commit -m "Probe: precon lists from MTGJSON" || exit 0
          git push
