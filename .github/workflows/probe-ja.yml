name: Probe live Japanese translations
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/claude/japanese-text-for-english-only-cards-iyrtt3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe_out
          (
            UA="warujie.jp probe (GitHub Actions)"
            for i in $(seq 1 30); do
              curl -s -A "$UA" https://warujie.warujie-mtg.workers.dev/index.html -o live.html
              h=$(sha256sum live.html | cut -c1-64); echo "try $i: $h"
              [ "$h" = "ab9b6e9f8da49664d001f6f8466513ebe28929eaaab8c75ef9248b772081662e" ] && echo "index.html MATCHES" && break
              sleep 20
            done
            grep -c "非公式訳" live.html || true
            curl -s --compressed -A "$UA" -H "Referer: https://warujie.warujie-mtg.workers.dev/" https://warujie.warujie-mtg.workers.dev/ja_cards.json -o db.json
            ls -la db.json
            python3 -c "
          import json; d=json.load(open('db.json')); f=d['fields']; i={k:n for n,k in enumerate(f)}
          print('text_ja_tr in fields:', 'text_ja_tr' in f)
          rows=[r for r in d['cards'] if r[i['name_en']]=='Black Lotus']
          print('Black Lotus:', rows[0][i['text_ja_tr']] if rows else None)
          print('with translation:', sum(1 for r in d['cards'] if r[i['text_ja_tr']]))"
          ) > probe_out/log.txt 2>&1 || true
          cat probe_out/log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
