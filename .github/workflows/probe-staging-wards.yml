name: Probe live page
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-staging-wards'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe_out
          curl -sS --compressed -o page.html "https://warujie.warujie-mtg.workers.dev/?view=events"
          ( for m in "ev-pl-rest" "多摩・島しょすべて" "'ev.tama'"; do echo "$m: $(grep -c -F "$m" page.html)"; done ) > probe_out/log.txt 2>&1
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
