name: Probe live calendar
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-staging-wards'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          mkdir -p probe_out
          ( pip install -q playwright==1.56.0 && python -m playwright install --with-deps chromium >/dev/null && python probe_live.py ) > probe_out/log.txt 2>&1 || true
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git pull -q --rebase || true
          git add probe_out && git commit -m "probe result [skip ci]" && git push
