name: Probe sign-in on the test site
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/claude/project-thread-gd4vip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe_out
          (
          S=https://staging-warujie.warujie-mtg.workers.dev
          W=https://warujie.jp
          echo "== config (staging)"; curl -sS -A "warujie.jp probe" "$S/api/account/config"; echo
          for p in line google; do
            echo "== start $p (staging): status and where it goes (query keys only)"
            curl -sS -o /dev/null -A "warujie.jp probe" -w '%{http_code} %{redirect_url}\n' "$S/auth/start?p=$p&state=probe123&cc=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&nonce=probe456" | sed -E 's/(client_id=)[^&]*/\1(set)/'
          done
          echo "== data with a made-up key (staging): 401 means the database answers"
          curl -sS -A "warujie.jp probe" -H "Origin: $S" -H "Authorization: Bearer AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" -w '\n%{http_code}\n' "$S/api/account/data"
          ) > probe_out/log.txt 2>&1 || true
          cat probe_out/log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
